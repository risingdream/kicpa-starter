<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부가세 계산 (실습용)</title>
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css">
  <style>
    body { font-family: "Pretendard GOV Variable", "Pretendard GOV", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #1f2328; background: #fff; }
    h1 { font-size: 1.4rem; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input { font-size: 1rem; padding: .5rem; width: 100%; box-sizing: border-box; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-top: .75rem; cursor: pointer; }
    #result { margin-top: 1.25rem; padding: .75rem 1rem; border: 1px solid #d0d7de; border-radius: 6px; }
    #result.error { border-color: #cf222e; color: #cf222e; }
    .note { color: #59636e; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>부가세 계산</h1>
  <p class="note">실습용 예시 화면입니다. 세율 10%, 1원 미만은 버립니다. 실제 고객 자료는 넣지 마세요.</p>

  <form id="form">
    <label for="supply">공급가액 (원)</label>
    <input id="supply" name="supply" inputmode="numeric" placeholder="예) 100,000" autocomplete="off">
    <button type="submit">계산하기</button>
  </form>

  <div id="result">공급가액을 넣고 [계산하기]를 누르면 여기에 결과가 나옵니다.</div>

  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const won = (n) => n.toLocaleString("ko-KR") + "원";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.className = "";
      result.textContent = "계산하는 중입니다…";
      try {
        const supply = encodeURIComponent(document.getElementById("supply").value);
        const response = await fetch("/api/vat?supply=" + supply);
        const data = await response.json();
        if (!data.ok) {
          result.className = "error";
          result.textContent = data.error;
          return;
        }
        result.innerHTML = "";
        for (const [name, value] of [["공급가액", data.supply], ["부가세", data.vat], ["합계", data.total]]) {
          const line = document.createElement("div");
          line.textContent = name + ": " + won(value);
          result.append(line);
        }
      } catch {
        result.className = "error";
        result.textContent = "서버에 연결하지 못했습니다. 잠시 뒤 다시 눌러 주세요.";
      }
    });
  </script>
</body>
</html>
