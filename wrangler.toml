# Cloudflare 배포 설정
# name은 배포 주소의 앞부분이 된다: https://<name>.<내 계정 이름>.workers.dev
# 내 도구 이름으로 바꿔도 된다(영문 소문자, 숫자, - 만)
name = "kicpa-starter"
main = "src/index.js"
compatibility_date = "2026-10-01"

# public/의 화면 파일을 그대로 보여 준다.
# 화면 파일에 없는 주소(/api/...)는 src/index.js가 받는다.
[assets]
directory = "./public"
